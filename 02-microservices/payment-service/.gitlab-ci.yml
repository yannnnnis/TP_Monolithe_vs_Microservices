stages:
  - test
  - build
  - deploy

test-payment:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - pytest

build-payment:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t shopdemo-payment-service .

deploy-payment:
  stage: deploy
  script:
    - echo "Déploiement indépendant du payment-service"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
